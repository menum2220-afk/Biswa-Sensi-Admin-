<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biswa Sensi Pro - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0d0e12; color: #fff; padding: 20px; }

    /* Admin Password Overlay */
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0e12; display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-box { background: #161820; padding: 30px; border-radius: 12px; border: 1px solid #ff6600; text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    
    .container { max-width: 950px; margin: 0 auto; display: none; }
    h1 { color: #ff6600; text-align: center; margin-bottom: 20px; letter-spacing: 1px; }
    
    .card { background: #161820; border-radius: 12px; padding: 20px; border: 1px solid #222533; margin-bottom: 20px; }
    .card h3 { color: #ff6600; margin-bottom: 15px; border-bottom: 1px solid #222533; padding-bottom: 8px; font-size: 16px; }

    .grid-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: center; }
    
    input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #2b2e3d; background: #0d0e12; color: #fff; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #ff6600; }
    
    .btn { background: #ff6600; color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
    .btn:hover { background: #e65c00; }
    .btn-danger { background: #ff3333; }
    .btn-warn { background: #ffaa00; color: #000; }
    .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 5px; }

    /* Table Styling */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222533; font-size: 13px; }
    th { background: #0d0e12; color: #ff6600; }
    .badge-active { color: #00ff66; font-weight: bold; background: rgba(0, 255, 102, 0.1); padding: 4px 8px; border-radius: 4px; }
    .badge-blocked { color: #ff3333; font-weight: bold; background: rgba(255, 51, 51, 0.1); padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- ADMIN LOGIN POPUP -->
  <div id="login-overlay">
    <div class="login-box">
      <h2 style="color: #ff6600; margin-bottom: 15px;">ADMIN PANEL</h2>
      <input type="password" id="adminPass" placeholder="Enter Admin Key (Default: 321)" style="width: 100%;">
      <button class="btn" style="width: 100%; margin-top: 15px;" onclick="verifyLogin()">LOGIN</button>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard" class="container">
    <h1>BISWA SENSI PRO - CONTROL PANEL</h1>

    <!-- 1. ADVANCED KEY GENERATOR -->
    <div class="card">
      <h3>Generate Custom Key</h3>
      <div class="grid-form">
        <input type="text" id="customKey" placeholder="Custom Key (Auto-generated if empty)">
        
        <input type="number" id="timeValue" placeholder="Qty (e.g. 1, 5, 12)" value="1" min="1">
        
        <select id="timeUnit">
          <option value="min">Minutes</option>
          <option value="hour">Hours</option>
          <option value="day" selected>Days</option>
          <option value="month">Months</option>
          <option value="life">Unlimited (Lifetime)</option>
        </select>
        
        <button class="btn" onclick="generateKey()">Generate Key</button>
      </div>
    </div>

    <!-- 2. GLOBAL SETTINGS -->
    <div class="card">
      <h3>Global App Settings</h3>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="telegramUrl" placeholder="Telegram Link (e.g. https://t.me/biswa_mods)" style="flex: 1;">
        <button class="btn" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>

    <!-- 3. KEYS DATABASE TABLE -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3>All Active & Expired Keys</h3>
        <button class="btn btn-sm" onclick="loadKeys()">Refresh Table</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>KEY</th>
              <th>VALIDITY / EXPIRY</th>
              <th>STATUS</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="keysTableBody">
            <tr><td colspan="4">Loading data from Firebase...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_BASE_URL = "https://biswasensipro-62f4a-default-rtdb.firebaseio.com";
    const ADMIN_KEY = "321";

    function verifyLogin() {
      const pass = document.getElementById('adminPass').value.trim();
      if (pass === ADMIN_KEY) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadKeys();
      } else {
        alert("Incorrect Password!");
      }
    }

    // Auto-Generate Random Serial Key
    function makeRandomKey() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let result = "";
      for (let i = 0; i < 4; i++) {
        let segment = "";
        for (let j = 0; j < 5; j++) {
          segment += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        result += (i === 3) ? segment : segment + "-";
      }
      return result;
    }

    async function generateKey() {
      let key = document.getElementById('customKey').value.trim();
      if (!key) key = makeRandomKey();

      const val = parseInt(document.getElementById('timeValue').value) || 1;
      const unit = document.getElementById('timeUnit').value;

      let expiryText = "";
      let expireTimestamp = 0; // Epoch timestamp in MS
      const now = new Date().getTime();

      if (unit === "min") {
        expiryText = `${val} Minute(s)`;
        expireTimestamp = now + (val * 60 * 1000);
      } else if (unit === "hour") {
        expiryText = `${val} Hour(s)`;
        expireTimestamp = now + (val * 60 * 60 * 1000);
      } else if (unit === "day") {
        expiryText = `${val} Day(s)`;
        expireTimestamp = now + (val * 24 * 60 * 60 * 1000);
      } else if (unit === "month") {
        expiryText = `${val} Month(s)`;
        expireTimestamp = now + (val * 30 * 24 * 60 * 60 * 1000);
      } else if (unit === "life") {
        expiryText = "Lifetime (Unlimited)";
        expireTimestamp = 9999999999999;
      }

      const keyData = {
        active: true,
        expiry: expiryText,
        expireAt: expireTimestamp,
        created_at: new Date().toISOString()
      };

      await fetch(`${FIREBASE_BASE_URL}/keys/${key}.json`, {
        method: 'PUT',
        body: JSON.stringify(keyData)
      });

      alert(`Key Generated Successfully!\n\nKey: ${key}\nValidity: ${expiryText}`);
      document.getElementById('customKey').value = '';
      loadKeys();
    }

    async function loadKeys() {
      const tbody = document.getElementById('keysTableBody');
      tbody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";

      try {
        let res = await fetch(`${FIREBASE_BASE_URL}/keys.json`);
        let data = await res.json();

        tbody.innerHTML = "";
        if (!data) {
          tbody.innerHTML = "<tr><td colspan='4'>No keys generated yet.</td></tr>";
          return;
        }

        const now = new Date().getTime();

        for (let key in data) {
          let item = data[key];
          let isExpired = item.expireAt && item.expireAt < now && item.expiry !== "Lifetime (Unlimited)";
          
          let statusBadge = (item.active && !isExpired) 
            ? `<span class="badge-active">ACTIVE</span>` 
            : `<span class="badge-blocked">EXPIRED / BLOCKED</span>`;

          let tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${key}</b></td>
            <td>${item.expiry || 'Lifetime'}</td>
            <td>${statusBadge}</td>
            <td>
              <button class="btn btn-warn btn-sm" onclick="toggleBlock('${key}', ${item.active})">
                ${item.active ? 'Block' : 'Unblock'}
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteKey('${key}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='4'>Failed to fetch keys! Check Firebase connection.</td></tr>";
      }
    }

    async function toggleBlock(key, currentStatus) {
      await fetch(`${FIREBASE_BASE_URL}/keys/${key}.json`, {
        method: 'PATCH',
        body: JSON.stringify({ active: !currentStatus })
      });
      loadKeys();
    }

    async function deleteKey(key) {
      if (confirm(`Are you sure you want to delete key:\n${key}?`)) {
        await fetch(`${FIREBASE_BASE_URL}/keys/${key}.json`, {
          method: 'DELETE'
        });
        loadKeys();
      }
    }

    async function saveSettings() {
      const tgUrl = document.getElementById('telegramUrl').value.trim();
      if (!tgUrl) return alert("Please enter a valid URL!");

      await fetch(`${FIREBASE_BASE_URL}/settings.json`, {
        method: 'PATCH',
        body: JSON.stringify({ telegram: tgUrl })
      });
      alert("Settings Updated!");
    }
  </script>
</body>
</html>
